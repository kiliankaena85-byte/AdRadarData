# Configuration of Compliance Nuances, Sanctions and Thresholds (v2.0)
# Grounded in 12 Immutable Legal Axioms of Russian Ad & PD Compliance Practice

version: "2.0"
date_cutoff: "2026-11-14"

# 248-FZ Risk Indicators and Regulatory Thresholds
rkn_risk_indicator_threshold: 3
rkn_outdated_registry_year_cutoff: 2022
foreign_auth_fine_moratorium_until: "2029-01-01"

# 168-FZ Whitelists: Russian Academy of Sciences (РАН) approved loanwords (Decree 1102-r)
ran_dictionary_whitelist:
  - "фитнес"
  - "кешбэк"
  - "менеджер"
  - "маркетинг"
  - "бизнес"
  - "сервис"
  - "тариф"
  - "онлайн"
  - "сайт"
  - "бренд"
  - "ритейл"
  - "шоурум"
  - "промоутер"
  - "хостинг"
  - "домен"
  - "контент"

# 168-FZ Whitelists: Technical standards, protocols, abbreviations
tech_standards_whitelist:
  - "wi-fi"
  - "bluetooth"
  - "usb"
  - "full hd"
  - "iso"
  - "api"
  - "sla"
  - "crm"
  - "erp"
  - "b2b"
  - "oem"
  - "gost"

# KoAP RF Sanctions and Grouping Rules (Part 5 Art. 4.4, Art. 4.1.1, Art. 4.1.2)
koap_sanctions_table:
  "13.11_part_1":
    description: "Обработка ПД в случаях, не предусмотренных законом, либо несовместимая с целями"
    min_legal: 60000
    max_legal: 100000
    min_official: 10000
    max_official: 20000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "13.11_part_1.1":
    description: "Обработка ПД без согласия в письменной форме либо с нарушением требований к составу"
    min_legal: 30000
    max_legal: 150000
    min_official: 20000
    max_official: 40000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "13.11_part_2":
    description: "Обработка ПД без согласия субъекта (отсутствие чекбокса/согласия в форме)"
    min_legal: 30000
    max_legal: 150000
    min_official: 20000
    max_official: 40000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "13.11_part_3":
    description: "Невыполнение обязанности по опубликованию документа, определяющего политику обработки ПД"
    min_legal: 30000
    max_legal: 60000
    min_official: 6000
    max_official: 12000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "14.3_part_1":
    description: "Нарушение законодательства о рекламе (включая превосходную степень без сноски)"
    min_legal: 100000
    max_legal: 500000
    min_official: 4000
    max_official: 20000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "14.3_part_16":
    description: "Распространение интернет-рекламы без идентификатора рекламы (erid) либо непредставление в ЕРИР"
    min_legal: 200000
    max_legal: 500000
    min_official: 100000
    max_official: 200000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "14.8_part_2":
    description: "Включение в договор условий, ущемляющих права потребителя (в т.ч. объединение согласий 156-ФЗ)"
    min_legal: 10000
    max_legal: 20000
    min_official: 1000
    max_official: 2000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "13.11_part_8":
    description: "Невыполнение обязанности по обеспечению записи, систематизации и хранения ПДн граждан РФ с использованием баз данных в РФ (ч. 5 ст. 18 152-ФЗ)"
    min_legal: 1000000
    max_legal: 6000000
    min_official: 100000
    max_official: 200000
    sme_warning_eligible: false
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "14.8_part_1":
    description: "Нарушение права потребителя на информацию об изготовителе/продавце (ст. 9 ЗоЗПП, сокрытие реквизитов)"
    min_legal: 5000
    max_legal: 10000
    min_official: 500
    max_official: 1000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "14.7_part_2":
    description: "Введение потребителей в заблуждение относительно потребительских свойств или производителя (ст. 14.7 КоАП РФ, компании-фениксы)"
    min_legal: 100000
    max_legal: 500000
    min_official: 12000
    max_official: 20000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "20.3_part_1":
    description: "Публичное демонстрирование атрибутики или символики экстремистских организаций (Meta/Instagram/Facebook)"
    min_legal: 10000
    max_legal: 50000
    min_official: 1000
    max_official: 4000
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"

  "13.55_part_2":
    description: "Нарушение требований к авторизации (иностранная авторизация: Google, Apple, Telegram widget)"
    min_legal: 0
    max_legal: 0
    nominal_min_legal: 500000
    nominal_max_legal: 700000
    min_official: 0
    max_official: 0
    nominal_min_official: 30000
    nominal_max_official: 50000
    moratorium_active: true
    moratorium_until: "2029-01-01"
    sme_warning_eligible: true
    sme_discount_eligible: true
    grouping_rule: "single_fine_per_check"
