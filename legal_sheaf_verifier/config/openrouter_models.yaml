# OpenRouter Model Registry & Catalog Configuration (November 2026)
# Governs visual_qc and triad_decision_router

live_catalog_settings:
  refresh_interval_seconds: 86400  # 24 hours
  catalog_endpoint: "https://openrouter.ai/api/v1/models"
  cache_file: "C:/AdRadarData/cache/openrouter_models_catalog.json"
  circuit_breaker:
    consecutive_error_threshold: 3
    cooldown_seconds: 600  # 10 minutes
  rate_limit:
    max_requests_per_minute: 12
  cache_db: "C:/AdRadarData/db/vlm_cache.sqlite"

free_tier:
  primary: "nvidia/nemotron-3.5-super-vl:free"
  fallbacks:
    - "google/gemma-4-26b-a4b-it:free"
    - "google/gemma-4-31b-it:free"
    - "openrouter/free"
  decider: "perplexity/pplx-decider-v1.3:free"

paid_zdr_tier:
  primary: "google/gemini-4-hydrogen"
  alternatives:
    - "deepseek/deepseek-v4.1-flash-1017"
  vip_arbiter: "google/gemini-4-argon"
  provider_options:
    data_collection: "deny"
    zdr: true
  banned_models:
    - "google/gemini-2.5-flash"  # Deprecated Dec 1
    - "google/gemma-3"
    - "ling-3.2"  # 43.6% JSON error rate
