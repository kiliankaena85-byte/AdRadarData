[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-sheaf-verifier"
version = "0.1.0"
description = "Deterministic Cellular Sheaf Neural Network (16x41) for Russian Advertising Law Verification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Principal DL & Russian Legal Tech Researcher" }
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
full = [
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
adradar = "legal_sheaf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_sheaf", "src/ingestion"]

[tool.hatch.build.targets.wheel.force-include]
"src/showcase_server.py" = "showcase_server.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
